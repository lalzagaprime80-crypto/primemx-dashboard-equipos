<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="3; url=https://lordsnow1980.github.io/prime/">
  <title>Sistema trasladado — PrimeMX</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #09111f;
      color: #e8eef9;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #17315d 0, #09111f 52%);
    }
    main {
      width: min(560px, 100%);
      padding: 40px;
      text-align: center;
      background: rgba(13, 27, 49, .94);
      border: 1px solid #2d4f7f;
      border-radius: 20px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .38);
    }
    .mark {
      width: 62px;
      height: 62px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #1f6feb;
      font-size: 30px;
      font-weight: 800;
    }
    h1 { margin: 0 0 12px; font-size: clamp(26px, 5vw, 36px); }
    p { margin: 0 0 26px; color: #b8c6da; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 10px;
      background: #1f6feb;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    small { display: block; margin-top: 22px; color: #8194ae; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">P</div>
    <h1>Sistema trasladado</h1>
    <p>El Control de Biométricos y Pinpads de PrimeMX ahora se encuentra en su versión protegida y centralizada.</p>
    <a href="https://lordsnow1980.github.io/prime/">Abrir sistema vigente</a>
    <small>Serás redirigido automáticamente en 3 segundos.</small>
  </main>
  <script>
    window.setTimeout(function () {
      window.location.replace('https://lordsnow1980.github.io/prime/');
    }, 3000);
  </script>
</body>
</html>
